<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cmux-radar cmux sidebar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#ECECEF}
a{color:#9CC2FF}a:hover{color:#C7DCFF}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
</style>
</head>
<body>
<div style="width:340px;height:780px;box-sizing:border-box;background:#16171C;border-left:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column">
  <div style="height:40px;display:flex;align-items:center;gap:4px;padding:0 10px;border-bottom:1px solid rgba(255,255,255,0.07)">
    <button style="height:26px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#9A9AA5;font-size:12px">Files</button>
    <button style="height:26px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#9A9AA5;font-size:12px">Feed</button>
    <button style="height:26px;padding:0 10px;border:0;border-radius:6px;background:rgba(255,255,255,0.10);color:#F2F2F4;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px">cmux-radar <span style="min-width:16px;height:16px;border-radius:8px;background:#F5A524;color:#1A1203;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center">2</span></button>
  </div>

  <div style="padding:12px 14px 6px;font-size:11px;font-weight:600;letter-spacing:0.06em;color:#8C8C97">THIS WINDOW · 6 AGENTS</div>

  <div style="flex:1;display:flex;flex-direction:column;gap:6px;padding:0 8px;overflow:hidden">
    <div style="border-radius:10px;background:rgba(245,165,36,0.09);border:1px solid rgba(245,165,36,0.32);padding:10px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;border-radius:4px;background:#F5A524"></span><span style="font-size:12.5px;font-weight:600">GENERAL ADMIN</span><span style="margin-left:auto;font-size:11px;color:#A3A3AD">3m</span></div>
      <p style="margin:0;font-size:12px;line-height:1.45;color:#D2D2D8">How do you want to go: build it, try Muster, or fork Muster?</p>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <button style="height:26px;padding:0 9px;border-radius:13px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.05);color:#ECECEF;font-size:11.5px">1 Build</button>
        <button style="height:26px;padding:0 9px;border-radius:13px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.05);color:#ECECEF;font-size:11.5px">2 Muster</button>
        <button style="height:26px;padding:0 9px;border-radius:13px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.05);color:#ECECEF;font-size:11.5px">3 Fork</button>
      </div>
      <div style="display:flex;align-items:center;height:32px;border-radius:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);padding:0 4px 0 10px">
        <label for="s1" class="sr">Reply</label>
        <input id="s1" placeholder="Reply…" style="flex:1;min-width:0;background:transparent;border:0;outline:none;color:#F2F2F4;font-size:12px">
        <button aria-label="Send" style="width:24px;height:24px;border:0;border-radius:6px;background:#F5A524;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1A1203" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
      </div>
    </div>

    <div style="border-radius:10px;background:rgba(255,122,89,0.08);border:1px solid rgba(255,122,89,0.3);padding:10px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;border-radius:4px;background:#FF7A59"></span><span style="font-size:12.5px;font-weight:600">DOCS SITE</span><span style="margin-left:auto;font-size:11px;color:#A3A3AD">1m</span></div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#E6E6EA;background:rgba(0,0,0,0.3);border-radius:6px;padding:7px 9px">bun scripts/fetch-docs.ts --days 7</div>
      <div style="display:flex;gap:5px">
        <button style="flex:1;height:28px;border-radius:7px;border:0;background:#ECECEF;color:#111114;font-size:11.5px;font-weight:600">Allow</button>
        <button style="flex:1;height:28px;border-radius:7px;border:1px solid rgba(255,255,255,0.14);background:transparent;color:#ECECEF;font-size:11.5px">Always</button>
        <button style="flex:1;height:28px;border-radius:7px;border:1px solid rgba(255,255,255,0.14);background:transparent;color:#ECECEF;font-size:11.5px">Deny</button>
      </div>
    </div>

    <div style="border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:5px">
      <div style="display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;border-radius:4px;background:#5B9DFF"></span><span style="font-size:12.5px;font-weight:500">POMOFITNESS</span><span style="margin-left:auto;font-size:11px;color:#9A9AA5;font-family:'JetBrains Mono',monospace">1:12</span></div>
      <span style="font-size:11.5px;color:#A3A3AD;padding-left:15px">Running vitest, 42/58</span>
    </div>
    <div style="border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;border-radius:4px;background:#6B6B76"></span><span style="font-size:12.5px;color:#B9B9C2">V view localhost</span><span style="margin-left:auto;font-size:11px;color:#8C8C97">2h</span></div>
    <div style="border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;border-radius:4px;background:#6B6B76"></span><span style="font-size:12.5px;color:#B9B9C2">FINANCE DASHBOARD</span><span style="margin-left:auto;font-size:11px;color:#8C8C97">3d</span></div>
    <div style="border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;border-radius:4px;background:#6B6B76"></span><span style="font-size:12.5px;color:#B9B9C2">Planning</span><span style="margin-left:auto;font-size:11px;color:#8C8C97">9d</span></div>
  </div>

  <div style="padding:10px 14px;border-top:1px solid rgba(255,255,255,0.07);font-size:11.5px;color:#8C8C97;display:flex;justify-content:space-between">
    <span>Same data as the menu bar</span>
    <span style="font-family:'JetBrains Mono',monospace">⌘⇧B</span>
  </div>
</div>
</body>
</html>
