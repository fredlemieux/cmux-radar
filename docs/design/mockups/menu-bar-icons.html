<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cmux-radar menu bar icon states</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#ECECEF}
a{color:#9CC2FF}a:hover{color:#C7DCFF}
</style>
</head>
<body>
<div style="width:1780px;height:220px;box-sizing:border-box;background:#0E0F13;padding:32px 40px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px">

  <div style="display:flex;flex-direction:column;gap:14px">
    <div style="height:72px;border-radius:12px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8C8C97" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4"></path></svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:14px;font-weight:600">Idle</span><span style="font-size:12.5px;color:#9A9AA5">Dimmed glyph. Nothing to do.</span></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px">
    <div style="height:72px;border-radius:12px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F2F2F4" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="#5B9DFF" stroke="#5B9DFF"></circle><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4"></path><path d="M3.5 3.5a12 12 0 0 0 0 17M20.5 3.5a12 12 0 0 1 0 17" stroke-opacity="0.35"></path></svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:14px;font-weight:600">Working</span><span style="font-size:12.5px;color:#9A9AA5">Blue core, outer arcs pulse slowly.</span></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px">
    <div style="height:72px;border-radius:12px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;gap:8px">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F2F2F4" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4"></path></svg>
      <span style="min-width:28px;height:28px;border-radius:14px;background:#F5A524;color:#1A1203;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center">2</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:14px;font-weight:600">Needs you</span><span style="font-size:12.5px;color:#9A9AA5">Amber count of waiting sessions.</span></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px">
    <div style="height:72px;border-radius:12px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;gap:8px">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F2F2F4" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4"></path></svg>
      <span style="height:28px;padding:0 10px;border-radius:14px;background:#FF7A59;color:#1F0A04;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px">1 <span style="font-weight:600">allow?</span></span>
    </div>
    <div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:14px;font-weight:600">Permission</span><span style="font-size:12.5px;color:#9A9AA5">Coral pill: a tool call is blocked.</span></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px">
    <div style="height:72px;border-radius:12px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;gap:8px">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F2F2F4" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4"></path></svg>
      <span style="font-size:17px;font-weight:600;color:#F2F2F4">GENERAL ADMIN</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:14px;font-weight:600">Name mode (optional)</span><span style="font-size:12.5px;color:#9A9AA5">Shows the oldest waiting tab by name.</span></div>
  </div>

</div>
</body>
</html>
